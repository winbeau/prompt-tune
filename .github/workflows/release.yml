name: Publish installers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.1.2
permissions:
  contents: write
jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: node scripts/notices.mjs
      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Windows preview
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
      - run: node scripts/checksums.mjs
      - name: Upload macOS installers
        if: runner.os == 'macOS'
        shell: bash
        run: gh release upload "$RELEASE_TAG" release/PromptTune-*.dmg release/PromptTune-*.zip release/SHA256SUMS-*.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Upload Windows preview
        if: runner.os == 'Windows'
        shell: bash
        run: gh release upload "$RELEASE_TAG" release/PromptTune-*.exe release/SHA256SUMS-*.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
